name: Deploy Skill Bridge NB to Hostinger

# Runs automatically every time you push to the main branch on GitHub.
# It builds a clean, current copy of the app (so we're never stuck on an
# old Laravel version again) and uploads it straight to your Hostinger
# hosting over FTP. Nothing runs on your computer, and nothing runs on
# Hostinger except serving the finished files.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo's files
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, tokenizer, xml, curl, openssl

      - name: Create a fresh, current Laravel app
        run: composer create-project laravel/laravel build --no-interaction --prefer-dist

      - name: Overlay our custom Skill Bridge NB files on top
        run: |
          cp -r repo/app/Models/. build/app/Models/
          cp -r repo/app/Services/. build/app/Services/
          cp -r repo/app/Mail/. build/app/Mail/
          cp -r repo/app/Console/Commands/. build/app/Console/Commands/
          rm -rf build/app/Http/Controllers/Auth
          cp -r repo/app/Http/Controllers/Auth build/app/Http/Controllers/Auth
          rm -rf build/app/Http/Controllers/Staff
          cp -r repo/app/Http/Controllers/Staff build/app/Http/Controllers/Staff
          cp -f repo/config/auth.php build/config/auth.php
          cp -f repo/database/migrations/2026_09_22_*.php build/database/migrations/
          cp -f repo/routes/web.php build/routes/web.php
          cp -f repo/bootstrap/app.php build/bootstrap/app.php
          mkdir -p build/public/images
          cp -f repo/public/images/skill-logo.png build/public/images/skill-logo.png
          rm -rf build/resources/views
          cp -r repo/resources/views build/resources/views

      - name: Write the production settings file
        run: |
          php -r "echo 'base64:' . base64_encode(random_bytes(32));" > /tmp/appkey.txt
          cat > build/.env <<EOF
          APP_NAME="Skill Bridge NB"
          APP_ENV=production
          APP_KEY=$(cat /tmp/appkey.txt)
          APP_DEBUG=false
          APP_URL=${{ secrets.APP_URL }}

          LOG_CHANNEL=stack
          LOG_LEVEL=error

          DB_CONNECTION=sqlite

          CACHE_DRIVER=file
          SESSION_DRIVER=file
          QUEUE_CONNECTION=sync

          MAIL_MAILER=log
          MAIL_FROM_ADDRESS="no-reply@skillbridgenb.org"
          MAIL_FROM_NAME="Skill Bridge NB"
          EOF

      - name: Set up the database
        run: |
          mkdir -p build/database
          touch build/database/database.sqlite
          cd build && php artisan migrate --force
          cd build && php artisan account:create staff "${{ secrets.ADMIN_NAME }}" "${{ secrets.ADMIN_EMAIL }}" super_admin || true

      - name: Split the build into a "public" folder and a private "app" folder
        # Laravel is only safe to run if the WEBSITE'S folder only contains what
        # was inside Laravel's own "public" folder - everything else (your code,
        # .env, database) must sit next to it, NOT inside it, or visitors could
        # download your source code and secrets. Since Hostinger's "Document
        # Root" setting couldn't be found, we do the equivalent split ourselves
        # here, so nothing needs to be changed in Hostinger's settings at all.
        run: |
          mkdir -p publicroot appcode
          cp -r build/public/. publicroot/
          rsync -a --exclude='public' build/ appcode/
          sed -i \
            -e "s#\.\./vendor/autoload\.php#../skillbridge_app/vendor/autoload.php#" \
            -e "s#\.\./bootstrap/app\.php#../skillbridge_app/bootstrap/app.php#" \
            -e "s#\.\./storage/framework/maintenance\.php#../skillbridge_app/storage/framework/maintenance.php#" \
            publicroot/index.php

      - name: Upload the public files (what visitors' browsers actually reach)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publicroot/
          server-dir: ${{ secrets.FTP_PUBLIC_DIR || 'domains/skill-bridge.thedigisparrow.com/public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**

      - name: Upload the private app code (kept next to, not inside, the public folder)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./appcode/
          server-dir: ${{ secrets.FTP_APP_DIR || 'domains/skill-bridge.thedigisparrow.com/skillbridge_app/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
